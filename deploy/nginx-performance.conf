# Include inside the staffgo.by server block, not the legacy redirect server.
# Uses the existing document root. Keep any existing application routes.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/css application/javascript application/json application/ld+json application/xml text/xml image/svg+xml;

location ~* \.(?:css|js|png|webp|ico|svg)$ {
    expires 7d;
    try_files $uri =404;
}

location = /index.html {
    add_header Cache-Control "no-cache";
}

# Do not expose deployment notes or server configuration.
location ^~ /deploy/ { return 404; }
location = /README.md { return 404; }

# Include within the http context on the legacy domain server.
# Replace certificate paths with the existing certificate covering both names.
server {
    listen 80;
    listen [::]:80;
    server_name podrabotki.by www.podrabotki.by;
    return 301 https://staffgo.by$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name podrabotki.by www.podrabotki.by;
    ssl_certificate /etc/letsencrypt/live/podrabotki.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/podrabotki.by/privkey.pem;
    return 301 https://staffgo.by$request_uri;
}
